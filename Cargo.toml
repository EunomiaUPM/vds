[package]
name = "vds-test"
version = "0.1.0"
edition = "2024"
description = "Reference implementation of the Verifiable Data Space (VDS) and the Verifiable Anchor Delegation (VAD)"
license = "GPL-3.0-or-later"
repository = "https://github.com/EunomiaUPM/vds"
readme = "README.md"

[dependencies]
# ─── Serialisation ─────────────────────────────────────────────────────
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }

# ─── Observability ─────────────────────────────────────────────────────
tracing = "0.1.44"

# ─── Cryptography (RustCrypto family — pure Rust, no OpenSSL) ──────────
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
rsa = "0.9.10"
sha2 = "0.10"
rand = "0.8.5"
pkcs8 = "0.11.0"

# ─── Encoding ──────────────────────────────────────────────────────────
bs58 = "0.5"                                          # multibase z-base58btc (DI proofs)
base64 = { version = "0.22", features = ["alloc"] }    # base64url for JOSE / JWK
hex = "0.4"                                            # hex digests in content identifiers, key seeds
json-canon = "0.1.3"                                   # JCS canonicalisation (RFC 8785)

# ─── HTTP client for did:web resolution ───────────────────────────────
# rustls-tls avoids the OpenSSL system dependency; pure Rust TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `executor` gives futures::executor::block_on — used by the bench to run
# the (local, for did:jwk) async resolution once in setup without tokio.
futures = { version = "0.3.32", features = ["executor"] }
uuid = { version = "1.23.1", features = ["v4"] }
async-trait = "0.1.89"
serde_urlencoded = "0.7.1"
tokio = "1.52.3"

[dev-dependencies]
# Statistics-driven benchmarking framework. html_reports feature renders
# the HTML graphs into target/criterion/ after each run.
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false   # criterion provides its own runner via criterion_main!

